
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Completed | Highsoft Course Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="completion-page">
        <div class="completion-content">

            <div class="completion-icon" aria-hidden="true">✓</div>

            <h1>Course completed!</h1>
            <p>You finished <strong id="completed-course-title">your course</strong></p>

            <p class="completion-confirmation">
                Your course has been added to your completed courses.
            </p>

            <div class="completion-stats">
                <div>
                    <strong id="completed-lessons">5/5</strong>
                    <span>lessons</span>
                </div>
            </div>

            <div class="completion-actions">
                <a href="courses.html" class="completion-secondary-btn">
                    View my progress
                </a>
                <a href="courses.html" class="completion-primary-btn">
                    Explore more courses
                </a>
            </div>

        </div>
    </main>

</body>
</html>
